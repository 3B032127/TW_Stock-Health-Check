<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台股市場指標 API 測試頁面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 36px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #888;
            font-size: 14px;
        }

        .status-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .status-card {
            flex: 1;
            min-width: 200px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .status-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-value {
            font-size: 20px;
            font-weight: bold;
        }

        .status-success {
            color: #10b981;
        }

        .status-error {
            color: #ef4444;
        }

        .status-warning {
            color: #f59e0b;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .indicator-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .indicator-card:hover {
            transform: translateY(-5px);
            border-color: rgba(102, 126, 234, 0.5);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
        }

        .indicator-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .indicator-name {
            font-size: 16px;
            color: #888;
            font-weight: 500;
        }

        .indicator-id {
            font-size: 11px;
            color: #555;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 8px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }

        .indicator-value {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .value-up {
            color: #ef4444;
        }

        .value-down {
            color: #10b981;
        }

        .value-neutral {
            color: #888;
        }

        .indicator-change {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .change-absolute {
            padding: 4px 10px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
        }

        .change-percent {
            padding: 4px 10px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
        }

        .indicator-meta {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .meta-item {
            font-size: 13px;
            margin-bottom: 8px;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .meta-icon {
            font-size: 16px;
            margin-top: 1px;
        }

        .meta-description {
            color: #888;
        }

        .meta-note {
            color: #667eea;
        }

        .meta-text {
            color: #f59e0b;
            font-style: italic;
        }

        .loading {
            text-align: center;
            padding: 60px;
            font-size: 18px;
            color: #888;
        }

        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
        }

        .error-title {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .error-message {
            font-size: 14px;
            color: #888;
        }

        .refresh-btn {
            margin-top: 20px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .api-info {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .api-endpoint {
            font-family: 'Courier New', monospace;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 15px;
            border-radius: 6px;
            margin: 10px 0;
            font-size: 13px;
            color: #10b981;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .loading-spinner {
            animation: pulse 1.5s ease-in-out infinite;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>🇹🇼 台股市場指標 API 測試</h1>
            <p class="subtitle">Real-time Market Indicators Testing Dashboard</p>
        </header>

        <div class="api-info">
            <div class="status-label">API 端點</div>
            <div class="api-endpoint">GET http://localhost:8000/api/v1/market/indicators</div>
        </div>

        <div class="status-bar">
            <div class="status-card">
                <div class="status-label">連線狀態</div>
                <div class="status-value" id="connection-status">
                    <span class="loading-spinner">檢查中...</span>
                </div>
            </div>
            <div class="status-card">
                <div class="status-label">最後更新</div>
                <div class="status-value" id="last-updated">--</div>
            </div>
            <div class="status-card">
                <div class="status-label">指標數量</div>
                <div class="status-value" id="indicator-count">0</div>
            </div>
            <div class="status-card">
                <div class="status-label">資料來源</div>
                <div class="status-value" id="data-source">--</div>
            </div>
        </div>

        <div id="content">
            <div class="loading loading-spinner">
                <div style="font-size: 48px; margin-bottom: 20px;">⏳</div>
                正在載入市場指標數據...
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/api/v1/market/indicators';

        async function fetchIndicators() {
            const contentDiv = document.getElementById('content');

            try {
                console.log('🔄 Fetching data from:', API_URL);

                const response = await fetch(API_URL);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const result = await response.json();
                console.log('✅ Data received:', result);

                // Update status bar
                document.getElementById('connection-status').innerHTML =
                    '<span class="status-success">✓ 連線成功</span>';
                document.getElementById('last-updated').textContent =
                    result.data.updated_at || '--';
                document.getElementById('indicator-count').textContent =
                    result.data.indicators.length;
                document.getElementById('data-source').textContent =
                    result.source || '--';

                // Render indicators
                renderIndicators(result.data.indicators);

            } catch (error) {
                console.error('❌ Error:', error);

                document.getElementById('connection-status').innerHTML =
                    '<span class="status-error">✗ 連線失敗</span>';

                contentDiv.innerHTML = `
                    <div class="error">
                        <div class="error-title">❌ 無法連接到 API</div>
                        <div class="error-message">
                            <p><strong>錯誤訊息：</strong>${error.message}</p>
                            <p style="margin-top: 15px;">請確認：</p>
                            <ul style="text-align: left; display: inline-block; margin-top: 10px;">
                                <li>後端伺服器是否正在運行（port 8000）</li>
                                <li>CORS 設定是否正確</li>
                                <li>網路連線是否正常</li>
                            </ul>
                        </div>
                        <button class="refresh-btn" onclick="fetchIndicators()">
                            🔄 重新載入
                        </button>
                    </div>
                `;
            }
        }

        function renderIndicators(indicators) {
            const contentDiv = document.getElementById('content');

            const gridHTML = `
                <div class="grid">
                    ${indicators.map(ind => `
                        <div class="indicator-card">
                            <div class="indicator-header">
                                <div class="indicator-name">${ind.name}</div>
                                <div class="indicator-id">${ind.id}</div>
                            </div>
                            
                            <div class="indicator-value ${getValueClass(ind)}">
                                ${ind.value}
                            </div>
                            
                            ${renderChange(ind)}
                            
                            <div class="indicator-meta">
                                ${ind.description ? `
                                    <div class="meta-item meta-description">
                                        <span class="meta-icon">📊</span>
                                        <span>${ind.description}</span>
                                    </div>
                                ` : ''}
                                
                                ${ind.note ? `
                                    <div class="meta-item meta-note">
                                        <span class="meta-icon">💡</span>
                                        <span>${ind.note}</span>
                                    </div>
                                ` : ''}
                                
                                ${ind.text ? `
                                    <div class="meta-item meta-text">
                                        <span class="meta-icon">✨</span>
                                        <span>${ind.text}</span>
                                    </div>
                                ` : ''}
                                
                                ${ind.isPositiveForMarket !== undefined ? `
                                    <div class="meta-item" style="color: ${ind.isPositiveForMarket ? '#10b981' : '#ef4444'}">
                                        <span class="meta-icon">${ind.isPositiveForMarket ? '📈' : '📉'}</span>
                                        <span>${ind.isPositiveForMarket ? '利多' : '利空'}</span>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    `).join('')}
                </div>
                
                <div style="text-align: center; margin-top: 30px;">
                    <button class="refresh-btn" onclick="fetchIndicators()">
                        🔄 重新整理數據
                    </button>
                </div>
            `;

            contentDiv.innerHTML = gridHTML;
        }

        function getValueClass(ind) {
            if (ind.change === '' || ind.change === undefined) {
                return 'value-neutral';
            }
            return ind.isUp ? 'value-up' : 'value-down';
        }

        function renderChange(ind) {
            if (!ind.change && !ind.changePercent) {
                return '';
            }

            const arrow = ind.isUp ? '↑' : '↓';
            const colorClass = ind.isUp ? 'value-up' : 'value-down';

            return `
                <div class="indicator-change">
                    ${ind.change ? `
                        <div class="change-absolute ${colorClass}">
                            ${arrow} ${ind.change}
                        </div>
                    ` : ''}
                    ${ind.changePercent ? `
                        <div class="change-percent ${colorClass}">
                            ${ind.changePercent}
                        </div>
                    ` : ''}
                </div>
            `;
        }

        // Initial load
        fetchIndicators();

        // Auto-refresh every 30 seconds
        setInterval(fetchIndicators, 30000);

        console.log('📱 Test page loaded. API URL:', API_URL);
    </script>
</body>

</html>
